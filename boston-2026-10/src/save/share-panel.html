      <div class="share" id="share">
        <h3 class="share-title">What share of my day is that?</h3>
        <p class="share-help">Optional. Your targets never leave this page.</p>
        <div class="share-fields">
          <label class="field"><span class="field-name">Protein, g a day</span>
            <input id="share-protein" type="text" inputmode="numeric" autocomplete="off" maxlength="5"></label>
          <label class="field"><span class="field-name">Calories a day</span>
            <input id="share-calories" type="text" inputmode="numeric" autocomplete="off" maxlength="6"></label>
        </div>
        <p class="share-hint" id="share-hint">Pick a meal size and how many meals, and type either target or both.</p>
        <div class="share-out" id="share-out" aria-live="polite" hidden>
          <p id="share-targets"></p>
          <p id="share-protein-line" hidden></p>
          <p id="share-calories-line" hidden></p>
        </div>
      </div>
